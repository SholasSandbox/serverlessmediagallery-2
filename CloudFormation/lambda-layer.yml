# yaml-language-server: $schema=https://raw.githubusercontent.com/awslabs/goformation/master/schema/cloudformation.schema.json
AWSTemplateFormatVersion: "2010-09-09"
Description: Media Gallery Lambda Layer - IAM Roles + Media API Lambda + S3 Processor Lambda

Parameters:
# -------------------------------------------------------------------------------------
# NOTE ABOUT THE S3 BUCKET
# The bucket used by this application (ImagesBucketName) already exists and was NOT
# created by CloudFormation. This stack MUST NOT attempt to:
#   - create it
#   - update it
#   - delete it
#   - add notifications through CFN
#
# S3 event notifications for this bucket must be configured OUTSIDE CloudFormation
# using the AWS CLI:
#
#   - aws lambda add-permission ...
#   - aws s3api put-bucket-notification-configuration ...
#
# Removing or altering these resources through CFN could DESTROY or REPLACE the bucket.
# -------------------------------------------------------------------------------------

  ImagesVideosBucketName:
    Type: String
    Default: an-image-gallery-olu-2025-abcxyz
    Description: Existing S3 bucket for images/videos.

  MetadataTableName:
    Type: String
    Default: media-gallery-metadata
    Description: Existing DynamoDB metadata table.

  VideoMinLabelConfidence:
    Type: Number
    Default: 70
    Description: Minimum confidence for video labels.

  VideoMaxLabels:
    Type: Number
    Default: 5
    Description: Maximum labels to store for videos.

  VideoAllowedLabels:
    Type: String
    Default: "Dancing,Dance,Performance,Concert,Music,Walking,Running,Jumping"
    Description: Comma-separated allowlist for video labels (blank means allow all).

Resources:
  # ---------------------------
  # IAM Role for Media API Lambda
  # ---------------------------
  MediaApiLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MediaApiLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

              # S3 access for presigned URL generation
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !Sub "arn:aws:s3:::${ImagesVideosBucketName}"
                  - !Sub "arn:aws:s3:::${ImagesVideosBucketName}/*"

              # DynamoDB metadata create/update
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MetadataTableName}"

  # ---------------------------
  # IAM Role for S3 Processor Lambda
  # ---------------------------
  S3ProcessorLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3ProcessorLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

              # Read object metadata
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:HeadObject
                Resource: !Sub "arn:aws:s3:::${ImagesVideosBucketName}/*"

              # Allow sending to DLQ
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt S3ProcessorDeadLetterQueue.Arn

              # Update metadata in DynamoDB
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MetadataTableName}"

              # Rekognition labels
              - Effect: Allow
                Action:
                  - rekognition:DetectLabels
                  - rekognition:StartLabelDetection
                Resource: "*"
              # Allow Rekognition to publish to SNS via topic role
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt RekVideoTopicPublishRole.Arn

  # ---------------------------
  # Media API Lambda (skeleton)
  # ---------------------------
  MediaApiLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: MediaApiLambdaV2
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt MediaApiLambdaRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          BUCKET_NAME: !Ref ImagesVideosBucketName
          TABLE_NAME: !Ref MetadataTableName
      Code:
        ZipFile: |
          import json
          import os
          import boto3
          import uuid
          from datetime import datetime
          from botocore.exceptions import ClientError

          s3 = boto3.client("s3")
          ddb = boto3.client("dynamodb")

          BUCKET = os.environ["BUCKET_NAME"]
          TABLE  = os.environ["TABLE_NAME"]

          ALLOWED_CONTENT_TYPES = {
              "image/jpeg",
              "image/jpg",
              "image/pjpeg",
              "image/png",
              "image/webp",
              "image/gif",
              "image/heic",
              "image/heif",
              "video/mp4",
              "video/quicktime",
              "video/x-m4v",
          }
          MAX_KEY_LENGTH = 256

          def _is_allowed_content_type(ct: str) -> bool:
              if ct in ALLOWED_CONTENT_TYPES:
                  return True
              # Allow any image/* or video/* as a fallback
              return ct.startswith("image/") or ct.startswith("video/")

          def _bad_request(message):
              return {
                  "statusCode": 400,
                  "headers": {
                      "Content-Type": "application/json",
                      "Access-Control-Allow-Origin": "*"
                  },
                  "body": json.dumps({"error": message})
              }

          def handler(event, context):
              """
              Expected input (later via API Gateway):
                {
                  "filename": "cat.jpg",
                  "contentType": "image/jpeg"
                }
              """
              try:
                  http = (event.get("requestContext") or {}).get("http", {}) if isinstance(event, dict) else {}
                  method = (http.get("method") or "").upper()
                  path = http.get("path") or ""

                  # Handle GET /signed-url?key=<objectKey> to fetch a presigned view URL
                  if method == "GET" and path.endswith("/signed-url"):
                      params = event.get("queryStringParameters") or {}
                      object_key = params.get("key")
                      if not object_key:
                          return _bad_request("Missing 'key' query parameter")

                      # Validate object exists before generating URL
                      view_url = s3.generate_presigned_url(
                          ClientMethod="get_object",
                          Params={
                              "Bucket": BUCKET,
                              "Key": object_key
                          },
                          ExpiresIn=900  # 15 minutes
                      )

                      return {
                          "statusCode": 200,
                          "headers": {
                              "Content-Type": "application/json",
                              "Access-Control-Allow-Origin": "*"
                          },
                          "body": json.dumps({"viewUrl": view_url})
                      }

                  body = event.get("body")
                  if body and isinstance(body, str):
                      body = json.loads(body)
                  body = body or {}

                  raw_filename = body.get("filename", "file.bin")
                  filename = os.path.basename(raw_filename).strip() or "file.bin"
                  if len(filename) > MAX_KEY_LENGTH:
                      filename = filename[-MAX_KEY_LENGTH:]

                  content_type = (body.get("contentType") or "").lower()
                  if not content_type:
                      content_type = "application/octet-stream"

                  if not _is_allowed_content_type(content_type):
                      return _bad_request(
                          "Unsupported contentType. Allowed: image/* and video/* (common types: "
                          + ", ".join(sorted(ALLOWED_CONTENT_TYPES))
                          + ")"
                      )

                  object_key = f"uploads/{uuid.uuid4()}-{filename}"

                  presigned_url = s3.generate_presigned_url(
                      ClientMethod="put_object",
                      Params={
                          "Bucket": BUCKET,
                          "Key": object_key,
                          "ContentType": content_type
                      },
                      ExpiresIn=3600
                  )

                  ddb.put_item(
                      TableName=TABLE,
                      Item={
                          "objectKey": {"S": object_key},
                          "filename": {"S": filename},
                          "contentType": {"S": content_type},
                          "status": {"S": "UPLOADING"},
                          "createdAt": {"S": datetime.utcnow().isoformat()}
                      }
                  )

                  return {
                      "statusCode": 200,
                      "headers": {
                          "Content-Type": "application/json",
                          "Access-Control-Allow-Origin": "*"
                      },
                      "body": json.dumps({
                          "uploadUrl": presigned_url,
                          "objectKey": object_key
                      })
                  }

              except Exception as e:
                  print("ERROR in MediaApiLambda:", e)
                  return {
                      "statusCode": 500,
                      "headers": {
                          "Content-Type": "application/json",
                          "Access-Control-Allow-Origin": "*"
                      },
                      "body": json.dumps({"error": "Internal server error"})
                  }
  # ---------------------------
  # IAM Role for Media List Lambda
  # ---------------------------
  MediaListLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MediaListLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Allow writing to CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

              # Allow reading from DynamoDB metadata table
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:GetItem
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MetadataTableName}"
              # Allow validating objects exist in S3
              - Effect: Allow
                Action:
                  - s3:HeadObject
                Resource: !Sub "arn:aws:s3:::${ImagesVideosBucketName}/*"

  # ---------------------------
  # Media List Lambda (GET /media)
  # ---------------------------
  MediaListLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: MediaListLambdaV2
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt MediaListLambdaRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref MetadataTableName
          BUCKET_NAME: !Ref ImagesVideosBucketName
      Code:
        ZipFile: |
          import json
          import os
          import boto3
          from decimal import Decimal
          import mimetypes
          from botocore.exceptions import ClientError

          TABLE = os.environ["TABLE_NAME"]
          # Optional bucket for S3 existence checks
          BUCKET = os.environ.get("BUCKET_NAME")
          ddb = boto3.resource("dynamodb")
          table = ddb.Table(TABLE)
          s3_client = boto3.client("s3") if BUCKET else None

          def _convert(obj):
              if isinstance(obj, list):
                  return [_convert(i) for i in obj]
              if isinstance(obj, dict):
                  return {k: _convert(v) for k, v in obj.items()}
              if isinstance(obj, Decimal):
                  return float(obj)
              return obj

          def handler(event, context):
              try:
                  params = (event.get("queryStringParameters") or {}) if isinstance(event, dict) else {}
                  try:
                      limit = int(params.get("limit", 50))
                  except ValueError:
                      limit = 50
                  limit = max(1, min(limit, 100))  # clamp to [1, 100]

                  search = (params.get("search") or "").strip().lower()
                  search_terms = [t for t in search.split() if t]

                  start_key = params.get("startKey")
                  if start_key:
                      try:
                          start_key = json.loads(start_key)
                      except Exception:
                          return {
                              "statusCode": 400,
                              "headers": {
                                  "Content-Type": "application/json",
                                  "Access-Control-Allow-Origin": "*"
                              },
                              "body": json.dumps({"error": "Invalid startKey"})
                          }
                  else:
                      start_key = None

                  resp = table.scan(Limit=limit, ExclusiveStartKey=start_key) if start_key else table.scan(Limit=limit)
                  items = _convert(resp.get("Items", []))

                  # Filter to valid media only (status READY and known content types)
                  allowed_types = {
                      "image/jpeg",
                      "image/jpg",
                      "image/png",
                      "image/webp",
                      "image/gif",
                      "image/heic",
                      "image/heif",
                      "video/mp4",
                      "video/quicktime",
                      "video/x-m4v",
                  }
                  filtered = []
                  for it in items:
                      if it.get("status") != "READY":
                          continue
                      ct = (it.get("contentType") or "").lower()
                      if not (ct in allowed_types or ct.startswith("image/") or ct.startswith("video/")):
                          # try to guess from filename if missing/generic
                          guess, _ = mimetypes.guess_type((it.get("objectKey") or ""))
                          if guess:
                              ct = guess.lower()
                              it["contentType"] = ct
                      if not (ct in allowed_types or ct.startswith("image/") or ct.startswith("video/")):
                          continue
                      key = (it.get("objectKey") or "").strip()
                      if not key:
                          continue
                      # Keep the key as stored (supports both root and uploads/ prefixes)
                      it["objectKey"] = key

                      if search_terms:
                          labels = [lbl.lower() for lbl in it.get("labels", []) if isinstance(lbl, str)]
                          filename = (it.get("filename") or "").lower()
                          key_lower = key.lower()
                          # match if any term is in labels, filename, or objectKey
                          if not any(
                              term in filename
                              or term in key_lower
                              or any(term in lbl for lbl in labels)
                              for term in search_terms
                          ):
                              continue

                      filtered.append(it)
                  items = filtered

                  # Return just the items array to match the frontend expectations
                  return {
                      "statusCode": 200,
                      "headers": {
                          "Content-Type": "application/json",
                          "Access-Control-Allow-Origin": "*"
                      },
                      "body": json.dumps(items)
                  }
              except Exception as e:
                  print("ERROR in MediaListLambda:", e)
                  return {
                      "statusCode": 500,
                      "headers": {
                          "Content-Type": "application/json",
                          "Access-Control-Allow-Origin": "*"
                      },
                      "body": json.dumps({"error": "Internal server error"})
                  }


  # ---------------------------
  # S3 Processor Lambda (skeleton)
  # ---------------------------
  S3ProcessorDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 300

  S3ProcessorLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: S3ProcessorLambdaV2
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt S3ProcessorLambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref MetadataTableName
          MIN_LABEL_CONFIDENCE: "50"
          MAX_LABELS: "5"
          ALLOWED_LABELS: ""
          SNS_TOPIC_ARN: !Ref RekVideoTopic
          TOPIC_ROLE_ARN: !GetAtt RekVideoTopicPublishRole.Arn
      DeadLetterConfig:
        TargetArn: !GetAtt S3ProcessorDeadLetterQueue.Arn
      Code:
        ZipFile: |
          import json
          import os
          import boto3
          import mimetypes
          from datetime import datetime
          from botocore.exceptions import ClientError

          s3 = boto3.client("s3")
          ddb = boto3.client("dynamodb")
          rek = boto3.client("rekognition")

          TABLE = os.environ["TABLE_NAME"]
          MIN_LABEL_CONFIDENCE = float(os.environ.get("MIN_LABEL_CONFIDENCE", "50"))
          MAX_LABELS = int(os.environ.get("MAX_LABELS", "5"))
          ALLOWED_LABELS = {
              lbl.strip().lower()
              for lbl in (os.environ.get("ALLOWED_LABELS") or "").split(",")
              if lbl.strip()
          }
          SNS_TOPIC_ARN = os.environ.get("SNS_TOPIC_ARN")
          TOPIC_ROLE_ARN = os.environ.get("TOPIC_ROLE_ARN")

          def handler(event, context):
              print("EVENT:", json.dumps(event))
              errors = []

              for record in event.get("Records", []):
                  try:
                      bucket = record["s3"]["bucket"]["name"]
                      key = record["s3"]["object"]["key"]

                      head = s3.head_object(Bucket=bucket, Key=key)
                      size = head.get("ContentLength", 0)
                      content_type = (head.get("ContentType") or "application/octet-stream").lower()

                      # If missing/generic, guess from key
                      if not content_type.startswith("image/") and not content_type.startswith("video/"):
                          guess, _ = mimetypes.guess_type(key)
                          if guess:
                              content_type = guess.lower()

                      labels = []
                      is_image = content_type.startswith("image/")
                      is_video = content_type.startswith("video/")

                      if is_image:
                          try:
                              obj = s3.get_object(Bucket=bucket, Key=key)
                              img_bytes = obj["Body"].read()
                              resp = rek.detect_labels(
                                  Image={"Bytes": img_bytes},
                                  MaxLabels=25,
                                  MinConfidence=MIN_LABEL_CONFIDENCE,
                              )
                              sorted_labels = sorted(
                                  resp.get("Labels", []),
                                  key=lambda x: x.get("Confidence", 0),
                                  reverse=True,
                              )
                              for lbl in sorted_labels:
                                  name = lbl.get("Name")
                                  if not name:
                                      continue
                                  name_l = name.lower()
                                  if ALLOWED_LABELS and name_l not in ALLOWED_LABELS:
                                      continue
                                  labels.append(name)
                                  if len(labels) >= MAX_LABELS:
                                      break
                          except Exception as e:
                              print(f"Rekognition failed for {key}: {e}")
                              labels = []
                      elif is_video and SNS_TOPIC_ARN and TOPIC_ROLE_ARN:
                          try:
                              resp = rek.start_label_detection(
                                  Video={"S3Object": {"Bucket": bucket, "Name": key}},
                                  MinConfidence=MIN_LABEL_CONFIDENCE,
                                  NotificationChannel={
                                      "SNSTopicArn": SNS_TOPIC_ARN,
                                      "RoleArn": TOPIC_ROLE_ARN,
                                  },
                              )
                              print(f"Started video label detection for {key}: {resp.get('JobId')}")
                          except Exception as e:
                              print(f"Video label start failed for {key}: {e}")

                      ddb.update_item(
                          TableName=TABLE,
                          Key={"objectKey": {"S": key}},
                          UpdateExpression="SET #s=:ready, fileSize=:size, contentType=:ct, processedAt=:ts, labels=:lbls",
                          ExpressionAttributeNames={"#s": "status"},
                          ExpressionAttributeValues={
                              ":ready": {"S": "READY"},
                              ":size": {"N": str(size)},
                              ":ct": {"S": content_type},
                              ":ts": {"S": datetime.utcnow().isoformat()},
                              ":lbls": {"L": [{"S": l} for l in labels]}
                          }
                      )
                  except Exception as e:
                      print(f"ERROR processing record {record}: {e}")
                      errors.append({"record": record, "error": str(e)})

              if errors:
                  # Trigger retry/DLQ by raising; successful updates are idempotent.
                  raise RuntimeError(f"Failed to process {len(errors)} record(s)")

              return {"statusCode": 200}

  # ---------------------------
  # S3 Event Notification Permission
  # ---------------------------
  S3InvokeProcessorPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref S3ProcessorLambda
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${ImagesVideosBucketName}"

  # Allow S3 to invoke the video analysis lambda (notification configured externally)
  S3InvokeVideoAnalysisPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref VideoAnalysisLambda
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${ImagesVideosBucketName}"

  # ---------------------------
  # Rekognition Video Pipeline
  # ---------------------------
  RekVideoTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: media-gallery-rekvideo

  RekVideoTopicPublishRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: rekognition.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RekVideoTopicPublishPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: "sns:Publish"
                Resource: !Ref RekVideoTopic

  RekVideoQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 300

  RekVideoSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: sqs
      TopicArn: !Ref RekVideoTopic
      Endpoint: !GetAtt RekVideoQueue.Arn

  RekVideoQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref RekVideoQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "sqs:SendMessage"
            Resource: !GetAtt RekVideoQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref RekVideoTopic

  # Role to start Rekognition Video jobs
  VideoAnalysisLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: VideoAnalysisPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Effect: Allow
                Action:
                  - rekognition:StartLabelDetection
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:HeadObject
                Resource: !Sub "arn:aws:s3:::${ImagesVideosBucketName}/*"
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt RekVideoTopicPublishRole.Arn

  # Role to read Rekognition Video results
  VideoResultsLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: VideoResultsPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt RekVideoQueue.Arn
              - Effect: Allow
                Action:
                  - rekognition:GetLabelDetection
                Resource: "*"
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MetadataTableName}"

  VideoAnalysisLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: MediaVideoAnalysisLambda
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt VideoAnalysisLambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          MIN_LABEL_CONFIDENCE: "60"
          SNS_TOPIC_ARN: !Ref RekVideoTopic
          TOPIC_ROLE_ARN: !GetAtt RekVideoTopicPublishRole.Arn
      Code:
        ZipFile: |
          import os, json, boto3
          from botocore.exceptions import ClientError

          rek = boto3.client("rekognition")

          SNS_TOPIC_ARN = os.environ["SNS_TOPIC_ARN"]
          TOPIC_ROLE_ARN = os.environ["TOPIC_ROLE_ARN"]
          MIN_CONF = float(os.environ.get("MIN_LABEL_CONFIDENCE", "60"))

          def handler(event, context):
            # Triggered by S3:ObjectCreated (video uploads)
            records = event.get("Records", [])
            for r in records:
              try:
                s3info = r.get("s3", {})
                bucket = s3info.get("bucket", {}).get("name")
                key = s3info.get("object", {}).get("key")
                if not bucket or not key:
                  continue
                # Start label detection
                resp = rek.start_label_detection(
                  Video={"S3Object": {"Bucket": bucket, "Name": key}},
                  MinConfidence=MIN_CONF,
                  NotificationChannel={
                    "SNSTopicArn": SNS_TOPIC_ARN,
                    "RoleArn": TOPIC_ROLE_ARN,
                  }
                )
                print(f"Started label detection for {key}: {resp.get('JobId')}")
              except ClientError as e:
                print(f"StartLabelDetection failed for record {r}: {e}")
            return {"statusCode": 200}

  VideoResultsLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: MediaVideoResultsLambda
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt VideoResultsLambdaRole.Arn
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref MetadataTableName
          MAX_LABELS: !Ref VideoMaxLabels
          MIN_LABEL_CONFIDENCE: !Ref VideoMinLabelConfidence
          VIDEO_ALLOWED_LABELS: !Ref VideoAllowedLabels
      Code:
        ZipFile: |
          import os, json, boto3
          from decimal import Decimal
          from botocore.exceptions import ClientError

          ddb = boto3.client("dynamodb")
          rek = boto3.client("rekognition")

          TABLE = os.environ["TABLE_NAME"]
          MAX_LABELS = int(os.environ.get("MAX_LABELS", "8"))
          MIN_CONF = float(os.environ.get("MIN_LABEL_CONFIDENCE", "60"))
          ALLOWED = {
            lbl.strip().lower()
            for lbl in (os.environ.get("VIDEO_ALLOWED_LABELS") or "").split(",")
            if lbl.strip()
          }

          def handler(event, context):
            for record in event.get("Records", []):
              try:
                msg = json.loads(record["body"])
                # SNS -> SQS message: message is in "Message"
                inner = msg.get("Message")
                payload = json.loads(inner) if isinstance(inner, str) else inner
                job_id = payload.get("JobId")
                if not job_id:
                  continue

                # Retrieve labels (GetLabelDetection is NOT pageable via paginator in this API version)
                labels = {}
                next_token = None
                while True:
                  kwargs = {"JobId": job_id, "SortBy": "TIMESTAMP"}
                  if next_token:
                    kwargs["NextToken"] = next_token
                  page = rek.get_label_detection(**kwargs)
                  for det in page.get("Labels", []):
                    name = det.get("Label", {}).get("Name")
                    conf = det.get("Label", {}).get("Confidence", 0)
                    if not name or conf < MIN_CONF:
                      continue
                    name_l = name.lower()
                    if ALLOWED and name_l not in ALLOWED:
                      continue
                    # keep max confidence seen
                    if name not in labels or conf > labels[name]:
                      labels[name] = conf
                  next_token = page.get("NextToken")
                  if not next_token:
                    break

                # Keep top N by confidence
                sorted_labels = sorted(labels.items(), key=lambda x: x[1], reverse=True)[:MAX_LABELS]
                final = [lbl for lbl, _ in sorted_labels]

                # Rekognition payload includes Video metadata with S3ObjectName
                s3obj = (payload.get("Video") or {}).get("S3ObjectName") or ""
                if not s3obj:
                  print("No object key found in payload, skipping")
                  continue

                ddb.update_item(
                  TableName=TABLE,
                  Key={"objectKey": {"S": s3obj}},
                  UpdateExpression="SET labels = :lbls, processedAt = :ts",
                  ExpressionAttributeValues={
                    ":lbls": {"L": [{"S": l} for l in final]},
                    ":ts": {"S": context.aws_request_id},
                  }
                )
                print(f"Updated labels for {s3obj}: {final}")
              except Exception as e:
                print(f"Failed to handle record {record}: {e}")
                raise
            return {"statusCode": 200}

  VideoResultsSQSMappings:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 5
      EventSourceArn: !GetAtt RekVideoQueue.Arn
      FunctionName: !Ref VideoResultsLambda

