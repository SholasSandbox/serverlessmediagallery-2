AWSTemplateFormatVersion: '2010-09-09'
Description: 'Serverless Media Gallery - Core Infrastructure (Days 1-3)'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name
  
  MediaBucketName:
    Type: String
    Description: S3 bucket name for media storage (must be globally unique)
    Default: ''
    # If empty, will auto-generate with account ID

Conditions:
  CreateBucketName: !Equals [!Ref MediaBucketName, '']

Resources:
  # ==========================================
  # STORAGE LAYER
  # ==========================================
  
  # S3 Bucket for Media Storage
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If
        - CreateBucketName
        - !Sub 'media-gallery-${AWS::AccountId}-${Environment}'
        - !Ref MediaBucketName
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - '*'  # Restrict this in production to your CloudFront domain
            AllowedMethods:
              - GET
              - PUT
              - POST
              - HEAD
            AllowedHeaders:
              - '*'
            MaxAge: 3000
            ExposedHeaders:
              - ETag
      LifecycleConfiguration:
        Rules:
          - Id: DeleteIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: TransitionToIA
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt S3ProcessorFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: MediaGallery
  
  # DynamoDB Table for Metadata
  MediaMetadataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'MediaGallery-${Environment}'
      BillingMode: PAY_PER_REQUEST  # On-demand pricing for dev
      AttributeDefinitions:
        - AttributeName: mediaId
          AttributeType: S
        - AttributeName: uploadedAt
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: mediaId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: uploadedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: MediaGallery
  
  # ==========================================
  # IAM ROLES
  # ==========================================
  
  # IAM Role for Upload Lambda
  UploadLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediaGallery-UploadLambda-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectAcl
                Resource: !Sub '${MediaBucket.Arn}/uploads/*'
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt MediaMetadataTable.Arn
                  - !Sub '${MediaMetadataTable.Arn}/index/*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
  
  # IAM Role for S3 Processor Lambda
  S3ProcessorLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediaGallery-S3Processor-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:HeadObject
                Resource: !Sub '${MediaBucket.Arn}/*'
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                Resource: !GetAtt MediaMetadataTable.Arn
      Tags:
        - Key: Environment
          Value: !Ref Environment
  
  # ==========================================
  # LAMBDA FUNCTIONS
  # ==========================================
  
  # Upload API Lambda Function
  UploadLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'MediaGallery-Upload-${Environment}'
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt UploadLambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          BUCKET_NAME: !Ref MediaBucket
          TABLE_NAME: !Ref MediaMetadataTable
          PRESIGNED_URL_EXPIRY: '300'  # 5 minutes
      Code:
        ZipFile: |
          import json
          import boto3
          import uuid
          import os
          from datetime import datetime, timezone
          
          s3 = boto3.client('s3')
          dynamodb = boto3.resource('dynamodb')
          table = dynamodb.Table(os.environ['TABLE_NAME'])
          
          def lambda_handler(event, context):
              try:
                  # Parse request body
                  body = json.loads(event.get('body', '{}'))
                  filename = body.get('filename')
                  content_type = body.get('contentType', 'application/octet-stream')
                  
                  if not filename:
                      return {
                          'statusCode': 400,
                          'headers': {'Access-Control-Allow-Origin': '*'},
                          'body': json.dumps({'error': 'filename is required'})
                      }
                  
                  # Generate unique media ID
                  media_id = str(uuid.uuid4())
                  s3_key = f"uploads/{media_id}/{filename}"
                  
                  # Generate pre-signed URL (5 minutes)
                  presigned_url = s3.generate_presigned_url(
                      'put_object',
                      Params={
                          'Bucket': os.environ['BUCKET_NAME'],
                          'Key': s3_key,
                          'ContentType': content_type
                      },
                      ExpiresIn=int(os.environ['PRESIGNED_URL_EXPIRY'])
                  )
                  
                  # Write initial metadata to DynamoDB
                  table.put_item(Item={
                      'mediaId': media_id,
                      'status': 'UPLOADING',
                      'filename': filename,
                      'contentType': content_type,
                      's3Key': s3_key,
                      'uploadedAt': datetime.now(timezone.utc).isoformat(),
                      'updatedAt': datetime.now(timezone.utc).isoformat()
                  })
                  
                  return {
                      'statusCode': 200,
                      'headers': {
                          'Access-Control-Allow-Origin': '*',
                          'Content-Type': 'application/json'
                      },
                      'body': json.dumps({
                          'uploadUrl': presigned_url,
                          'mediaId': media_id,
                          'expiresIn': 300
                      })
                  }
                  
              except Exception as e:
                  print(f"Error: {str(e)}")
                  return {
                      'statusCode': 500,
                      'headers': {'Access-Control-Allow-Origin': '*'},
                      'body': json.dumps({'error': 'Internal server error'})
                  }
      Tags:
        - Key: Environment
          Value: !Ref Environment
  
  # S3 Processor Lambda Function
  S3ProcessorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'MediaGallery-S3Processor-${Environment}'
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt S3ProcessorLambdaRole.Arn
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          TABLE_NAME: !Ref MediaMetadataTable
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from datetime import datetime, timezone
          from urllib.parse import unquote_plus
          
          s3 = boto3.client('s3')
          dynamodb = boto3.resource('dynamodb')
          table = dynamodb.Table(os.environ['TABLE_NAME'])
          
          def lambda_handler(event, context):
              try:
                  for record in event['Records']:
                      # Get S3 object details
                      bucket = record['s3']['bucket']['name']
                      key = unquote_plus(record['s3']['object']['key'])
                      size = record['s3']['object']['size']
                      
                      # Extract mediaId from key (uploads/{mediaId}/{filename})
                      parts = key.split('/')
                      if len(parts) < 3 or parts[0] != 'uploads':
                          print(f"Skipping invalid key: {key}")
                          continue
                      
                      media_id = parts[1]
                      
                      # Get object metadata
                      head_response = s3.head_object(Bucket=bucket, Key=key)
                      content_type = head_response.get('ContentType', 'application/octet-stream')
                      
                      # Update DynamoDB with final metadata
                      table.update_item(
                          Key={'mediaId': media_id},
                          UpdateExpression='SET #status = :status, #size = :size, contentType = :contentType, s3Bucket = :bucket, s3Key = :key, updatedAt = :updatedAt',
                          ExpressionAttributeNames={
                              '#status': 'status',
                              '#size': 'size'
                          },
                          ExpressionAttributeValues={
                              ':status': 'READY',
                              ':size': size,
                              ':contentType': content_type,
                              ':bucket': bucket,
                              ':key': key,
                              ':updatedAt': datetime.now(timezone.utc).isoformat()
                          }
                      )
                      
                      print(f"Successfully processed {media_id}: {key}")
                  
                  return {'statusCode': 200, 'body': 'Success'}
                  
              except Exception as e:
                  print(f"Error processing S3 event: {str(e)}")
                  raise
      Tags:
        - Key: Environment
          Value: !Ref Environment
  
  # Permission for S3 to invoke Processor Lambda
  S3ProcessorInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref S3ProcessorFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !GetAtt MediaBucket.Arn
  
  # CloudWatch Log Groups
  UploadLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${UploadLambdaFunction}'
      RetentionInDays: 7
  
  S3ProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${S3ProcessorFunction}'
      RetentionInDays: 7
  
  # ==========================================
  # API GATEWAY
  # ==========================================
  
  # REST API
  MediaGalleryAPI:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub 'MediaGallery-${Environment}'
      Description: Media Gallery API
      EndpointConfiguration:
        Types:
          - REGIONAL
  
  # /upload Resource
  UploadResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediaGalleryAPI
      ParentId: !GetAtt MediaGalleryAPI.RootResourceId
      PathPart: upload
  
  # POST /upload Method
  UploadPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediaGalleryAPI
      ResourceId: !Ref UploadResource
      HttpMethod: POST
      AuthorizationType: NONE  # Add Cognito authorizer in production
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UploadLambdaFunction.Arn}/invocations'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
  
  # OPTIONS /upload Method (CORS)
  UploadOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediaGalleryAPI
      ResourceId: !Ref UploadResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true
  
  # Lambda Permission for API Gateway
  UploadLambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UploadLambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${MediaGalleryAPI}/*'
  
  # API Deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - UploadPostMethod
      - UploadOptionsMethod
    Properties:
      RestApiId: !Ref MediaGalleryAPI
      StageName: !Ref Environment
      StageDescription:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
        LoggingLevel: INFO
        DataTraceEnabled: true
        MetricsEnabled: true

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${MediaGalleryAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-ApiEndpoint'
  
  UploadEndpoint:
    Description: Upload API endpoint
    Value: !Sub 'https://${MediaGalleryAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/upload'
  
  MediaBucketName:
    Description: S3 bucket for media storage
    Value: !Ref MediaBucket
    Export:
      Name: !Sub '${AWS::StackName}-MediaBucket'
  
  MediaTableName:
    Description: DynamoDB table for metadata
    Value: !Ref MediaMetadataTable
    Export:
      Name: !Sub '${AWS::StackName}-MediaTable'
  
  UploadLambdaArn:
    Description: Upload Lambda function ARN
    Value: !GetAtt UploadLambdaFunction.Arn
  
  S3ProcessorLambdaArn:
    Description: S3 Processor Lambda function ARN
    Value: !GetAtt S3ProcessorFunction.Arn
